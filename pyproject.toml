[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-axi"
version = "0.1.0"
description = "Fast judgment before expensive thought: provider-neutral bounded probabilistic decisions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pydantic>=2.10,<3", "jsonschema>=4.23,<5"]

[project.scripts]
reflex-axi = "reflex_axi.entry:main"

[project.optional-dependencies]
gliner = ["gliner2[local]==2.0.0"]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15", "types-jsonschema>=4", "build>=1.2"]

[tool.setuptools.package-data]
reflex_axi = ["packs/*.json", "benchmarks/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.scratch/pytest"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
